name: Build

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Windows rather than Linux: the net35/net472 targets and the ILRepack merge each project
    # runs after compilation are only exercised on Windows during development, and a release
    # must be built exactly the way it was tested. Only the Silksong target is TFM-portable.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FsmMaster.sln

      - name: Build
        run: dotnet build FsmMaster.sln --configuration Release --no-restore

      - name: Upload release zips
        uses: actions/upload-artifact@v4
        with:
          name: FsmMaster-zips
          path: |
            release/*.zip
            thunderstore/build/*.zip
          if-no-files-found: error
